<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CineVault{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #60a5fa;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            background: #1f2937;
            padding: 10px 14px;
            border-radius: 8px;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            background: #2563eb;
        }

        main {
            padding: 30px 0;
            min-height: 80vh;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .hero {
            text-align: center;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #111827;
        }

        .hero p {
            font-size: 1.1rem;
            color: #4b5563;
            max-width: 700px;
            margin: 0 auto 25px auto;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            cursor: pointer;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-success:hover {
            background: #15803d;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #111827;
            color: white;
        }

        tr:hover {
            background: #f9fafb;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #111827;
        }

        .section-subtitle {
            color: #6b7280;
            margin-bottom: 20px;
        }

        .empty {
            color: #6b7280;
            font-style: italic;
            margin-top: 15px;
        }

        form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 220px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
        }

        .movie-result {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            margin-top: 25px;
        }

        .movie-poster img {
            width: 220px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        .movie-info {
            flex: 1;
            min-width: 250px;
        }

        .movie-info h3 {
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        .movie-info p {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        footer {
            background: #111827;
            color: #d1d5db;
            text-align: center;
            padding: 18px 0;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-links {
                width: 100%;
            }

            .movie-result {
                flex-direction: column;
            }
        }
        /* =========================
   busca multipla + detalhes
========================= */

.search-page,
.details-page {
    max-width: 1200px;
    margin: 0 auto;
}

.search-header {
    margin-bottom: 24px;
}

.search-tip {
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    color: #cbd5e1;
    font-size: 0.95rem;
}

.search-form {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
}

.search-form input {
    flex: 1;
    min-width: 260px;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f8fafc;
    outline: none;
}

.search-form input:focus {
    border-color: #38bdf8;
}

.error-box {
    margin: 20px 0;
    padding: 14px;
    background: #fee2e2;
    color: #991b1b;
    border-radius: 10px;
}

.empty-message {
    margin-top: 20px;
    color: #cbd5e1;
}

.results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
}

.movie-card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.movie-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
}

.movie-poster img {
    width: 100%;
    height: 330px;
    object-fit: cover;
    display: block;
}

.movie-card-content {
    padding: 16px;
}

.movie-card-content h3 {
    margin-bottom: 10px;
    font-size: 1.05rem;
}

.movie-card-content p {
    margin-bottom: 8px;
    color: #d1d5db;
}

.no-poster {
    width: 100%;
    height: 330px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1f2937;
    color: #94a3b8;
    font-weight: bold;
}

.no-poster.large {
    height: 420px;
}

.details-card {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 30px;
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 20px;
    padding: 24px;
    margin-top: 20px;
}

.details-poster img {
    width: 100%;
    border-radius: 16px;
    object-fit: cover;
}

.details-info h1 {
    margin-bottom: 18px;
}

.details-info p {
    margin-bottom: 10px;
    color: #d1d5db;
    line-height: 1.6;
}

.back-link {
    display: inline-block;
    margin-bottom: 18px;
    color: #38bdf8;
    text-decoration: none;
    font-weight: 600;
}

.back-link:hover {
    text-decoration: underline;
}

@media (max-width: 768px) {
    .details-card {
        grid-template-columns: 1fr;
    }

    .details-poster {
        max-width: 320px;
        margin: 0 auto;
    }
}
.movie-card-title {
    font-size: 1.15rem;
    line-height: 1.4;
    color: #f8fafc;
    margin-bottom: 12px;
    min-height: 52px;
    display: flex;
    align-items: center;
}

.movie-title {
    font-size: 2rem;
    line-height: 1.2;
    color: #ffffff;
    margin-bottom: 18px;
}

.movie-card-content p,
.details-info p {
    font-size: 1rem;
    line-height: 1.6;
}

.movie-card-content {
    padding: 18px;
}

.movie-card-content .btn {
    margin-top: 12px;
    display: inline-block;
}

.trailer-actions {
    margin-top: 24px;
}
    </style>
</head>
<body>

    <header>
        <div class="container navbar">
            <div class="logo">🎬 CineVault</div>

            <nav class="nav-links">
    <a href="/">Início</a>
    <a href="/categorias/">Categorias</a>
    <a href="/filmes/">Filmes</a>
    <a href="{% url 'buscar_filme_api' %}">Buscar</a>
    <a href="/admin/">Admin</a>
</nav>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>CineVault • Catálogo de filmes</p>
        </div>
    </footer>

</body>
</html>
