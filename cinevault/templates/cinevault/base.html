<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Filmes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
        }
        ul {
            padding-left: 20px;
        }
        .card {
            border: 1px solid #ddd;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #fff;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">home</a>
        <a href="{% url 'listar_categorias' %}">categorias</a>
        <a href="{% url 'listar_filmes' %}">filmes</a>
        <a href="{% url 'buscar_filme_api' %}">buscar api</a>
    </nav>
    <hr>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
